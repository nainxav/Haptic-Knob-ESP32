<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haptic Knob – Needle Insertion 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e0e8; }
  canvas { display: block; }

  /* ---- HUD overlay ---- */
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between; padding: 20px 28px;
  }
  #hud > div { pointer-events: auto; }

  .panel {
    background: rgba(12,12,22,.82);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; padding: 16px 22px;
  }

  h1 { font-size: 15px; font-weight: 600; letter-spacing: .4px; margin-bottom: 8px; color: #c0c0d0; }
  .sub { font-size: 10px; color: #666; margin-bottom: 10px; letter-spacing: .2px; }

  .metric { display: flex; align-items: baseline; gap: 6px; margin: 4px 0; }
  .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #888; min-width: 56px; }
  .metric-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-sm .metric-value { font-size: 15px; }

  .state-badge {
    display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px;
    font-weight: 700; letter-spacing: .6px; margin-top: 4px;
  }
  .layer-badge {
    display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px;
    font-weight: 700; letter-spacing: .6px; margin-top: 4px; margin-left: 6px;
  }
  .state-air      { background: rgba(80,180,255,.18); color: #60c0ff; }
  .state-deform   { background: rgba(255,180,50,.18);  color: #ffb840; }
  .state-cutting  { background: rgba(255,70,70,.18);   color: #ff5050; }
  .layer-skin     { background: rgba(242,201,168,.2);  color: #f2c9a8; }
  .layer-fat      { background: rgba(245,230,160,.2);  color: #f5e6a0; }
  .layer-muscle   { background: rgba(176,48,48,.2);    color: #e05050; }

  /* connect button */
  #connectBtn {
    pointer-events: auto; cursor: pointer;
    background: linear-gradient(135deg,#3a6df0,#5b4de0); color: #fff;
    border: none; border-radius: 10px; padding: 10px 20px;
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
    transition: transform .15s, box-shadow .2s;
  }
  #connectBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(90,70,240,.4); }
  #connectBtn:active { transform: scale(.97); }
  #connectBtn.connected { background: linear-gradient(135deg,#20a060,#18c070); }

  .conn-panel { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

  /* bottom bar */
  #bottomBar {
    position: fixed; bottom: 0; left: 0; width: 100%;
    display: flex; justify-content: center; gap: 18px;
    padding: 14px 28px; pointer-events: none; z-index: 10;
  }
  .hint {
    pointer-events: auto; font-size: 11px; color: #666; letter-spacing: .3px;
    background: rgba(12,12,22,.7); padding: 6px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.05);
  }
  .hint kbd {
    background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 4px;
    font-family: inherit; font-size: 11px;
  }

  /* depth bar */
  .depth-bar-bg {
    width: 100%; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden;
  }
  .depth-bar-fill {
    height: 100%; border-radius: 3px; transition: width .08s, background .3s;
    width: 0%;
  }

  /* force graph */
  #forceCanvas {
    margin-top: 10px; border-radius: 6px;
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.05);
  }

  /* ---- Serial Log Panel ---- */
  #logPanel {
    position: fixed; bottom: 50px; right: 20px; z-index: 20;
    width: 420px; pointer-events: auto;
    background: rgba(8,8,16,.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
    transition: height .25s ease, opacity .2s;
  }
  #logPanel.collapsed { height: 36px !important; }
  #logPanel.collapsed #logBody { display: none; }

  #logHeader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; cursor: pointer; user-select: none;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #logHeader:hover { background: rgba(255,255,255,.03); }
  #logTitle {
    font-size: 11px; font-weight: 600; letter-spacing: .5px;
    color: #999; text-transform: uppercase;
  }
  #logTitle .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  #logTitle .dot.live  { background: #40e080; box-shadow: 0 0 6px #40e080; }
  #logTitle .dot.idle  { background: #666; }
  #logToggleIcon {
    font-size: 14px; color: #666; transition: transform .2s;
  }
  #logPanel.collapsed #logToggleIcon { transform: rotate(180deg); }

  #logBody { padding: 0; }

  #logContent {
    height: 220px; overflow-y: auto; padding: 6px 12px;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 11px; line-height: 1.6; color: #b0b0c0;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.1) transparent;
  }
  #logContent::-webkit-scrollbar { width: 5px; }
  #logContent::-webkit-scrollbar-track { background: transparent; }
  #logContent::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

  .log-line { white-space: nowrap; }
  .log-ts   { color: #555; margin-right: 6px; }
  .log-key  { color: #888; }
  .log-depth  { color: #60c0ff; }
  .log-force  { color: #ffaa40; }
  .log-state  { color: #ff5050; }
  .log-layer  { color: #f2c9a8; }
  .log-info   { color: #40e080; }
  .log-warn   { color: #e0c040; }

  #logFooter {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; border-top: 1px solid rgba(255,255,255,.05);
  }
  #logCount { font-size: 10px; color: #555; font-variant-numeric: tabular-nums; }
  #logClearBtn {
    font-size: 10px; color: #666; background: rgba(255,255,255,.06);
    border: none; border-radius: 4px; padding: 2px 10px; cursor: pointer;
    letter-spacing: .3px;
  }
  #logClearBtn:hover { color: #aaa; background: rgba(255,255,255,.1); }
  #logAutoScroll {
    font-size: 10px; color: #666; cursor: pointer; user-select: none;
  }
  #logAutoScroll.active { color: #40e080; }
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div>
    <div class="panel">
      <h1>Needle Insertion Simulation</h1>
      <div class="sub">HAPTIC KNOB IFAC TEAM 2026</div>
      <div class="metric">
        <span class="metric-label">Depth</span>
        <span class="metric-value" id="depthVal">0.0</span>
        <span style="font-size:12px;color:#666">mm</span>
      </div>
      <div class="metric">
        <span class="metric-label">Force</span>
        <span class="metric-value" id="forceVal">0.000</span>
      </div>
      <div class="metric metric-sm">
        <span class="metric-label">F_tip</span>
        <span class="metric-value" id="ftipVal">0.000</span>
      </div>
      <div class="metric metric-sm">
        <span class="metric-label">F_fric</span>
        <span class="metric-value" id="ffricVal">0.000</span>
      </div>
      <div>
        <span class="state-badge state-air" id="stateBadge">AIR</span>
        <span class="layer-badge" id="layerBadge" style="display:none"></span>
      </div>
      <div class="depth-bar-bg">
        <div class="depth-bar-fill" id="depthBar"></div>
      </div>
      <canvas id="forceCanvas" width="220" height="80"></canvas>
    </div>
  </div>
  <div class="conn-panel">
    <button id="connectBtn" onclick="toggleConnection()">Connect ESP32</button>
  </div>
</div>

<!-- Serial Log Panel -->
<div id="logPanel">
  <div id="logHeader" onclick="toggleLog()">
    <span id="logTitle"><span class="dot idle" id="logDot"></span>Serial Monitor</span>
    <span id="logToggleIcon">▼</span>
  </div>
  <div id="logBody">
    <div id="logContent"></div>
    <div id="logFooter">
      <span id="logCount">0 lines</span>
      <span id="logAutoScroll" class="active" onclick="toggleAutoScroll(event)">⇣ Auto-scroll</span>
      <button id="logClearBtn" onclick="clearLog(event)">Clear</button>
    </div>
  </div>
</div>

<div id="bottomBar">
  <span class="hint">Orbit: <kbd>Left Drag</kbd></span>
  <span class="hint">Zoom: <kbd>Scroll</kbd></span>
  <span class="hint">Move: <kbd>↑</kbd> <kbd>↓</kbd></span>
  <span class="hint">Reset: <kbd>R</kbd></span>
</div>

<!-- Three.js from CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== STATE ====================
const state = {
  depthMm: 0,
  force: 0,
  fTip: 0,
  fFric: 0,
  stateId: 0,        // 0 AIR, 1 DEFORM (pre-rupture), 2 CUT (post-rupture)
  layerIdx: -1,      // -1 air, 0 skin, 1 fat, 2 muscle
  velocity: 0,
  connected: false,
  mode: 'dummy',   // 'dummy' | 'hardware'
};

const LAYER = {
  skin:   { thickness: 2,  color: 0xf2c9a8 },
  fat:    { thickness: 8,  color: 0xf5e6a0 },
  muscle: { thickness: 25, color: 0xb03030 },
  deep:   { thickness: 15, color: 0x7a1e1e },
};
const TOTAL_DEPTH = Object.values(LAYER).reduce((s, l) => s + l.thickness, 0);
const MAX_DISPLAY_DEPTH = 35;
const TISSUE_WIDTH = 40;
const TISSUE_LENGTH = 40;

// ==================== SCENE ====================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c18);
scene.fog = new THREE.FogExp2(0x0c0c18, 0.008);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(32, 35, 48);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -10, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 20;
controls.maxDistance = 300;
controls.maxPolarAngle = Math.PI * 0.85;
controls.update();

// ==================== LIGHTING ====================
const ambientLight = new THREE.AmbientLight(0xc0c4e0, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e8, 1.8);
dirLight.position.set(15, 30, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -30;
dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -30;
dirLight.shadow.bias = -0.002;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0x6080ff, 0.6);
rimLight.position.set(-20, 10, -15);
scene.add(rimLight);

const pointLight = new THREE.PointLight(0xffa040, 0.4, 60);
pointLight.position.set(-10, 20, 10);
scene.add(pointLight);

// ==================== GROUND GRID ====================
const gridHelper = new THREE.GridHelper(100, 40, 0x222240, 0x181830);
gridHelper.position.y = -(TOTAL_DEPTH + 2);
scene.add(gridHelper);

// ==================== TISSUE BLOCK ====================
const tissueGroup = new THREE.Group();
scene.add(tissueGroup);

let yOffset = 0;
const layerMeshes = {};
const layerOrder = ['skin', 'fat', 'muscle', 'deep'];

for (const name of layerOrder) {
  const l = LAYER[name];
  const geom = new THREE.BoxGeometry(TISSUE_WIDTH, l.thickness, TISSUE_LENGTH);
  const mat = new THREE.MeshStandardMaterial({
    color: l.color,
    roughness: 0.65,
    metalness: 0.0,
    transparent: true,
    opacity: 0.88,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.y = -(yOffset + l.thickness / 2);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  tissueGroup.add(mesh);
  layerMeshes[name] = mesh;
  yOffset += l.thickness;
}

// Thin surface line on top of skin
const surfaceLineGeom = new THREE.BoxGeometry(TISSUE_WIDTH + 0.2, 0.15, TISSUE_LENGTH + 0.2);
const surfaceLineMat = new THREE.MeshBasicMaterial({ color: 0xffddc0 });
const surfaceLine = new THREE.Mesh(surfaceLineGeom, surfaceLineMat);
surfaceLine.position.y = 0.075;
tissueGroup.add(surfaceLine);

// Layer edge labels (thin colored strips on the front face)
for (const name of layerOrder) {
  const l = LAYER[name];
  const mesh = layerMeshes[name];
  const stripGeom = new THREE.BoxGeometry(0.3, l.thickness - 0.2, TISSUE_LENGTH + 0.4);
  const stripMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(l.color).multiplyScalar(1.3) });
  const strip = new THREE.Mesh(stripGeom, stripMat);
  strip.position.copy(mesh.position);
  strip.position.x = TISSUE_WIDTH / 2 + 0.15;
  tissueGroup.add(strip);
}

// ==================== SKIN DEFORMATION ====================
const deformRes = 48;
const deformGeom = new THREE.PlaneGeometry(TISSUE_WIDTH, TISSUE_LENGTH, deformRes, deformRes);
deformGeom.rotateX(-Math.PI / 2);
const deformMat = new THREE.MeshStandardMaterial({
  color: LAYER.skin.color,
  roughness: 0.55,
  metalness: 0.0,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.0,
});
const deformMesh = new THREE.Mesh(deformGeom, deformMat);
deformMesh.position.y = 0.08;
deformMesh.receiveShadow = true;
tissueGroup.add(deformMesh);

function updateDeformation(depth) {
  const posAttr = deformGeom.attributes.position;
  // Show deformation only for skin pre-rupture (layer 0, deform state)
  const skinDeforming = state.stateId === 1 && state.layerIdx === 0 && depth > 0;
  const indent = Math.max(0, Math.min(depth, LAYER.skin.thickness + 1));
  deformMat.opacity = skinDeforming ? 0.95 : 0.0;

  if (!skinDeforming) return;

  const radius = 3.5 + indent * 0.5;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const z = posAttr.getZ(i);
    const dist = Math.sqrt(x * x + z * z);
    let y = 0;
    if (dist < radius) {
      const t = 1 - dist / radius;
      y = -indent * t * t;
    }
    posAttr.setY(i, y);
  }
  posAttr.needsUpdate = true;
  deformGeom.computeVertexNormals();
}

// ==================== NEEDLE ====================
const needleGroup = new THREE.Group();
scene.add(needleGroup);

const needleMat = new THREE.MeshStandardMaterial({
  color: 0xd0d0d8,
  roughness: 0.18,
  metalness: 0.92,
});
const shaftLength = 50;
const shaftRadius = 0.35;
const shaftGeom = new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 16);
const shaft = new THREE.Mesh(shaftGeom, needleMat);
shaft.position.y = shaftLength / 2;
shaft.castShadow = true;
needleGroup.add(shaft);

const tipLength = 4;
const tipGeom = new THREE.ConeGeometry(shaftRadius, tipLength, 16);
tipGeom.rotateX(Math.PI);
const tipMat = new THREE.MeshStandardMaterial({
  color: 0xe8e8f0,
  roughness: 0.1,
  metalness: 0.95,
});
const tip = new THREE.Mesh(tipGeom, tipMat);
tip.position.y = -tipLength / 2;
tip.castShadow = true;
needleGroup.add(tip);

// Hub
const hubGeom = new THREE.CylinderGeometry(1.8, 1.0, 5, 8);
const hubMat = new THREE.MeshStandardMaterial({
  color: 0x3070d0,
  roughness: 0.4,
  metalness: 0.1,
});
const hub = new THREE.Mesh(hubGeom, hubMat);
hub.position.y = shaftLength + 2.5;
hub.castShadow = true;
needleGroup.add(hub);

// Wing grips
for (const side of [-1, 1]) {
  const wingGeom = new THREE.BoxGeometry(6, 0.6, 2);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x4488dd, roughness: 0.5, metalness: 0.05 });
  const wing = new THREE.Mesh(wingGeom, wingMat);
  wing.position.set(side * 4.5, shaftLength + 3, 0);
  wing.rotation.z = side * 0.25;
  wing.castShadow = true;
  needleGroup.add(wing);
}

// Needle glow ring (insertion feedback)
const glowRingGeom = new THREE.TorusGeometry(1.2, 0.25, 8, 24);
const glowRingMat = new THREE.MeshBasicMaterial({ color: 0xff4040, transparent: true, opacity: 0 });
const glowRing = new THREE.Mesh(glowRingGeom, glowRingMat);
glowRing.rotation.x = Math.PI / 2;
glowRing.position.y = 0;
needleGroup.add(glowRing);

function updateNeedle(depthMm) {
  const tipY = -depthMm;
  needleGroup.position.y = tipY + tipLength / 2;
}

// ==================== DEPTH RULER (side) ====================
const rulerGroup = new THREE.Group();
rulerGroup.position.x = -(TISSUE_WIDTH / 2 + 3);
scene.add(rulerGroup);

const rulerMat = new THREE.LineBasicMaterial({ color: 0x555570 });
for (let mm = 0; mm <= TOTAL_DEPTH; mm += 5) {
  const tickLen = mm % 10 === 0 ? 2.5 : 1.2;
  const points = [new THREE.Vector3(0, -mm, 0), new THREE.Vector3(-tickLen, -mm, 0)];
  const geom = new THREE.BufferGeometry().setFromPoints(points);
  rulerGroup.add(new THREE.Line(geom, rulerMat));
}
const rulerLinePoints = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -TOTAL_DEPTH, 0)];
rulerGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rulerLinePoints), rulerMat));

// Depth marker (moves with needle)
const markerGeom = new THREE.SphereGeometry(0.6, 12, 12);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xff6060 });
const depthMarker = new THREE.Mesh(markerGeom, markerMat);
rulerGroup.add(depthMarker);

// ==================== PUNCTURE PARTICLES ====================
const particleCount = 40;
const particleGeom = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);
particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeom.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

const particleMat = new THREE.PointsMaterial({
  color: 0xff5040,
  size: 0.5,
  transparent: true,
  opacity: 0,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeom, particleMat);
scene.add(particles);

let particleAge = 999;
const particleVelocities = [];
for (let i = 0; i < particleCount; i++) {
  particleVelocities.push(new THREE.Vector3());
}

function triggerPunctureEffect(yPos = 0) {
  particleAge = 0;
  particles.position.y = yPos;
  const posArr = particleGeom.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArr[i * 3] = (Math.random() - 0.5) * 2;
    posArr[i * 3 + 1] = 0;
    posArr[i * 3 + 2] = (Math.random() - 0.5) * 2;
    particleVelocities[i].set(
      (Math.random() - 0.5) * 12,
      Math.random() * 8 + 4,
      (Math.random() - 0.5) * 12
    );
  }
}

function updateParticles(dt) {
  if (particleAge > 2) return;
  particleAge += dt;
  const posArr = particleGeom.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    particleVelocities[i].y -= 20 * dt;
    posArr[i * 3]     += particleVelocities[i].x * dt;
    posArr[i * 3 + 1] += particleVelocities[i].y * dt;
    posArr[i * 3 + 2] += particleVelocities[i].z * dt;
  }
  particleGeom.attributes.position.needsUpdate = true;
  particleMat.opacity = Math.max(0, 1 - particleAge / 1.2) * 0.8;
}

// ==================== SERIAL ====================
let port = null;
let reader = null;
let serialBuffer = '';
let readLoopActive = false;

function setMode(mode) {
  state.mode = mode;
  const btn = document.getElementById('connectBtn');
  if (mode === 'hardware') {
    btn.textContent = 'Disconnect ESP32';
    btn.classList.add('connected');
  } else {
    btn.textContent = 'Connect ESP32';
    btn.classList.remove('connected');
  }
}

function formatEsp32Telemetry() {
  const st = state.stateId * 0.5;
  const li = state.layerIdx;
  return `Depth_mm:${state.depthMm.toFixed(2)} Force_cmd:${state.force.toFixed(4)} State:${st.toFixed(1)} Layer:${li} FTip:${state.fTip.toFixed(4)} FFric:${state.fFric.toFixed(4)}`;
}

async function connectSerial() {
  state.connected = true;
  setMode('hardware');
  addLogLine('Simulated connection to ESP32', 'info');
  logDot.className = 'dot live';
}

async function disconnectSerial() {
  state.connected = false;
  setMode('dummy');
  addLogLine('Disconnected', 'info');
  logDot.className = state.depthMm > 0 ? 'dot live' : 'dot idle';
}

function toggleConnection() {
  if (state.connected) disconnectSerial();
  else connectSerial();
}
window.toggleConnection = toggleConnection;

async function readLoop() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  reader = decoder.readable.getReader();
  try {
    while (readLoopActive) {
      const { value, done } = await reader.read();
      if (done) break;
      serialBuffer += value;
      let lines = serialBuffer.split('\n');
      serialBuffer = lines.pop();
      for (const line of lines) parseLine(line.trim());
    }
  } catch (e) {
    if (readLoopActive) console.warn('Serial read error', e);
  }
}

function parseLine(line) {
  if (!line) return;
  // Feed every serial line to the log
  if (line.includes('Depth_mm:')) {
    addLogLine(line, 'data');
    logDot.className = 'dot live';
    const parts = line.split(/\s+/);
    for (const p of parts) {
      const [key, val] = p.split(':');
      const v = parseFloat(val) || 0;
      if (key === 'Depth_mm')  state.depthMm  = v;
      if (key === 'Force_cmd') state.force     = v;
      if (key === 'State')     state.stateId   = Math.round(v / 0.5);
      if (key === 'Layer')     state.layerIdx  = Math.round(v);
      if (key === 'FTip')      state.fTip      = v;
      if (key === 'FFric')     state.fFric     = v;
    }
  } else if (line.startsWith('===') || line.includes('init') || line.includes('Homing') || line.includes('Calibrat')) {
    addLogLine(line, 'info');
  } else {
    addLogLine(line, 'warn');
  }
}

// ==================== KEYBOARD SIMULATION ====================
// Mirrors the ESP32 multi-layer Okamura + Mahvash-Dupont model
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') { state.depthMm = 0; simResetLayers(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Simulation layer state (matches ESP32 TissueLayer struct)
const simLayers = [
  { start: 0,  thick: 2,  a1: 0.08, a2: 0.12, Kp: 0.20, tau: 0.04, Fr: 0.55, Fc: 0.08, punctured: false, dK: 0, idK: 0 },
  { start: 2,  thick: 8,  a1: 0.012, a2: 0.002, Kp: 0.03, tau: 0.10, Fr: 0.22, Fc: 0.06, punctured: false, dK: 0, idK: 0 },
  { start: 10, thick: 25, a1: 0.018, a2: 0.004, Kp: 0.06, tau: 0.06, Fr: 0.35, Fc: 0.12, punctured: false, dK: 0, idK: 0 },
];
const MU_SHAFT = 0.003, B_VISCOUS = 0.0015;

function simResetLayers() {
  for (const L of simLayers) { L.punctured = false; L.dK = 0; L.idK = 0; }
  state.stateId = 0; state.layerIdx = -1; state.force = 0; state.fTip = 0; state.fFric = 0;
}

function simContactForce(L, delta, dt) {
  if (delta <= 0) { L.dK = 0; L.idK = 0; return 0; }
  const ratio = dt / L.tau;
  L.dK = (delta - L.idK / L.tau) / (1 + ratio);
  L.idK += L.dK * dt;
  return Math.max(0, L.a2 * delta * delta + L.a1 * delta + L.Kp * delta * L.dK);
}

let prevLayerPunctured = [false, false, false];

function simulateInput(dt) {
  const speed = 8;
  if (keys['ArrowDown'])  state.depthMm = Math.min(MAX_DISPLAY_DEPTH, state.depthMm + speed * dt);
  if (keys['ArrowUp'])    state.depthMm = Math.max(-5, state.depthMm - speed * dt);

  const d = state.depthMm;
  const vel = keys['ArrowDown'] ? speed : keys['ArrowUp'] ? -speed : 0;

  if (d <= 0) {
    state.stateId = 0; state.layerIdx = -1;
    state.force = 0; state.fTip = 0; state.fFric = 0;
    simResetLayers();
    return;
  }

  // Find layer
  let li = -1;
  for (let i = simLayers.length - 1; i >= 0; i--) { if (d >= simLayers[i].start) { li = i; break; } }
  if (li < 0) li = 0;
  state.layerIdx = li;
  const L = simLayers[li];
  const localD = d - L.start;

  if (L.punctured) {
    state.stateId = 2;
    state.fTip = L.Fc;
  } else {
    state.stateId = 1;
    state.fTip = simContactForce(L, localD, dt);
    if (state.fTip >= L.Fr) {
      L.punctured = true;
      state.fTip = L.Fc;
      state.stateId = 2;
      L.dK = 0; L.idK = 0;
    }
  }

  // Shaft friction
  const velMm = vel;
  state.fFric = Math.abs(velMm) > 0.5
    ? MU_SHAFT * d + Math.abs(B_VISCOUS * velMm)
    : MU_SHAFT * d * 0.3;

  state.force = state.fTip + state.fFric;

  // Trigger puncture particles for each layer transition
  for (let i = 0; i < simLayers.length; i++) {
    if (simLayers[i].punctured && !prevLayerPunctured[i]) {
      triggerPunctureEffect(-simLayers[i].start - simLayers[i].thick * 0.1);
    }
    prevLayerPunctured[i] = simLayers[i].punctured;
  }
}

// ==================== HUD UPDATE ====================
const forceCanvas = document.getElementById('forceCanvas');
const forceCtx = forceCanvas.getContext('2d');
const HIST_LEN = 220;
const forceHistory = new Array(HIST_LEN).fill(0);
const tipHistory   = new Array(HIST_LEN).fill(0);
const fricHistory  = new Array(HIST_LEN).fill(0);

const stateNames   = ['AIR', 'DEFORM', 'CUTTING'];
const stateClasses = ['state-air', 'state-deform', 'state-cutting'];
const stateColors  = ['#60c0ff', '#ffb840', '#ff5050'];

const layerNames   = ['SKIN', 'FAT', 'MUSCLE'];
const layerClasses = ['layer-skin', 'layer-fat', 'layer-muscle'];

function drawTrace(ctx, data, w, h, color, maxVal) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = (i / data.length) * w;
    const y = h - (data[i] / maxVal) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function updateHUD() {
  document.getElementById('depthVal').textContent = state.depthMm.toFixed(1);
  document.getElementById('forceVal').textContent = state.force.toFixed(3);
  document.getElementById('ftipVal').textContent  = state.fTip.toFixed(4);
  document.getElementById('ffricVal').textContent = state.fFric.toFixed(4);

  const badge = document.getElementById('stateBadge');
  badge.textContent = stateNames[state.stateId] || 'AIR';
  badge.className = 'state-badge ' + (stateClasses[state.stateId] || 'state-air');

  const lbadge = document.getElementById('layerBadge');
  if (state.layerIdx >= 0 && state.layerIdx < 3) {
    lbadge.style.display = 'inline-block';
    lbadge.textContent = layerNames[state.layerIdx];
    lbadge.className = 'layer-badge ' + layerClasses[state.layerIdx];
  } else {
    lbadge.style.display = 'none';
  }

  // Depth bar with layer-aware color
  const pct = Math.max(0, Math.min(100, (state.depthMm / MAX_DISPLAY_DEPTH) * 100));
  const bar = document.getElementById('depthBar');
  bar.style.width = pct + '%';
  bar.style.background = stateColors[state.stateId] || stateColors[0];

  // Force graph: total (white), tip (orange), friction (cyan)
  forceHistory.push(state.force);   if (forceHistory.length > HIST_LEN) forceHistory.shift();
  tipHistory.push(state.fTip);      if (tipHistory.length > HIST_LEN)   tipHistory.shift();
  fricHistory.push(state.fFric);    if (fricHistory.length > HIST_LEN)  fricHistory.shift();

  const w = forceCanvas.width, h = forceCanvas.height;
  forceCtx.clearRect(0, 0, w, h);

  // Layer boundary markers (horizontal lines at Fr thresholds)
  const maxF = 0.7;
  forceCtx.setLineDash([2, 3]);
  forceCtx.lineWidth = 0.5;
  for (const [fr, col] of [[0.55, '#f2c9a850'], [0.22, '#f5e6a050'], [0.35, '#e0505050']]) {
    forceCtx.strokeStyle = col;
    forceCtx.beginPath();
    const ly = h - (fr / maxF) * h;
    forceCtx.moveTo(0, ly); forceCtx.lineTo(w, ly);
    forceCtx.stroke();
  }
  forceCtx.setLineDash([]);

  drawTrace(forceCtx, fricHistory,  w, h, '#40c0c080', maxF);
  drawTrace(forceCtx, tipHistory,   w, h, '#ffaa40c0', maxF);
  drawTrace(forceCtx, forceHistory, w, h, '#ffffffd0', maxF);

  // Legend dots
  const dots = [[w - 8, 8, '#fff'], [w - 8, 18, '#ffaa40'], [w - 8, 28, '#40c0c0']];
  for (const [dx, dy, c] of dots) {
    forceCtx.fillStyle = c;
    forceCtx.beginPath();
    forceCtx.arc(dx, dy, 2.5, 0, Math.PI * 2);
    forceCtx.fill();
  }
  forceCtx.fillStyle = '#aaa';
  forceCtx.font = '8px sans-serif';
  forceCtx.textAlign = 'right';
  forceCtx.fillText('total', w - 14, 11);
  forceCtx.fillText('tip', w - 14, 21);
  forceCtx.fillText('fric', w - 14, 31);
}

// ==================== SERIAL LOG PANEL ====================
const logEl = document.getElementById('logContent');
const logPanel = document.getElementById('logPanel');
const logCountEl = document.getElementById('logCount');
const logDot = document.getElementById('logDot');
let logLineCount = 0;
let logAutoScroll = true;
const MAX_LOG_LINES = 500;

function toggleLog() {
  logPanel.classList.toggle('collapsed');
}
window.toggleLog = toggleLog;

function toggleAutoScroll(e) {
  e.stopPropagation();
  logAutoScroll = !logAutoScroll;
  document.getElementById('logAutoScroll').classList.toggle('active', logAutoScroll);
}
window.toggleAutoScroll = toggleAutoScroll;

function clearLog(e) {
  e.stopPropagation();
  logEl.innerHTML = '';
  logLineCount = 0;
  logCountEl.textContent = '0 lines';
}
window.clearLog = clearLog;

function addLogLine(text, type = 'data') {
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');

  const line = document.createElement('div');
  line.className = 'log-line';

  if (type === 'data' && text.includes('Depth_mm:')) {
    let html = `<span class="log-ts">${ts}</span>`;
    const parts = text.split(/\s+/);
    for (const p of parts) {
      const [k, v] = p.split(':');
      if (k === 'Depth_mm')       html += `<span class="log-key">Depth:</span><span class="log-depth">${v}</span> `;
      else if (k === 'Force_cmd') html += `<span class="log-key">F:</span><span class="log-force">${v}</span> `;
      else if (k === 'State')     html += `<span class="log-key">St:</span><span class="log-state">${v}</span> `;
      else if (k === 'Layer')     html += `<span class="log-key">L:</span><span class="log-layer">${v}</span> `;
      else if (k === 'FTip')      html += `<span class="log-key">Tip:</span><span class="log-force">${v}</span> `;
      else if (k === 'FFric')     html += `<span class="log-key">Fric:</span><span class="log-depth">${v}</span> `;
      else html += `<span class="log-key">${p}</span> `;
    }
    line.innerHTML = html;
  } else if (type === 'info') {
    line.innerHTML = `<span class="log-ts">${ts}</span><span class="log-info">${text}</span>`;
  } else if (type === 'warn') {
    line.innerHTML = `<span class="log-ts">${ts}</span><span class="log-warn">${text}</span>`;
  } else {
    line.innerHTML = `<span class="log-ts">${ts}</span>${text}`;
  }

  logEl.appendChild(line);
  logLineCount++;

  while (logEl.children.length > MAX_LOG_LINES) {
    logEl.removeChild(logEl.firstChild);
    logLineCount = logEl.children.length;
  }

  logCountEl.textContent = `${logLineCount} lines`;

  if (logAutoScroll) {
    logEl.scrollTop = logEl.scrollHeight;
  }
}

// ---- Dummy data generator (runs when not connected) ----
let dummyTime = 0;
let dummyInterval = null;
let dummyStarted = false;

function startDummyLog() {
  if (dummyInterval) return;
  if (!dummyStarted) {
    dummyStarted = true;
    addLogLine('=== Needle Insertion Simulation ===', 'info');
    addLogLine('Model: Okamura (2004) + Mahvash-Dupont contact', 'info');
    addLogLine('Layers: Skin / Fat / Muscle', 'info');
    addLogLine('Use ↑↓ to move the needle.', 'info');
  }

  dummyInterval = setInterval(() => {
    const line = formatEsp32Telemetry();
    addLogLine(line, 'data');
    logDot.className = state.depthMm > 0 ? 'dot live' : 'dot idle';
  }, 50);
}

setTimeout(startDummyLog, 500);

// ==================== ANIMATE ====================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  simulateInput(dt);
  controls.update();

  // Update 3D objects
  updateNeedle(state.depthMm);
  updateDeformation(state.depthMm);
  updateParticles(dt);

  // Depth marker on ruler
  depthMarker.position.y = -Math.max(0, state.depthMm);

  // Glow ring feedback
  const glowIntensity = state.stateId === 2 ? 0.5 : state.stateId === 1 ? state.force * 0.6 : 0;
  glowRingMat.opacity = glowIntensity;
  glowRingMat.color.setHex(state.stateId === 2 ? 0xff4040 : 0xffaa30);

  // Layer opacity pulse for active layer
  for (const name of layerOrder) {
    layerMeshes[name].material.opacity = 0.88;
  }
  if (state.depthMm > 0) {
    let accumulated = 0;
    for (const name of layerOrder) {
      accumulated += LAYER[name].thickness;
      if (state.depthMm <= accumulated) {
        layerMeshes[name].material.opacity = 0.72 + 0.08 * Math.sin(clock.elapsedTime * 3);
        break;
      }
    }
  }

  updateHUD();
  renderer.render(scene, camera);
}

animate();

// ==================== RESIZE ====================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
